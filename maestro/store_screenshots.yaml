appId: com.thevinesh.dejavu
---
# Deterministic walkthrough for a 3-letter word.
#
# splitIntoGroups(3) always yields ABC DEF GHI JKL MNO PQR STU VWX YZ, and the
# revealed word is [1st letter of the 1st pick, 2nd of the 2nd, 3rd of the 3rd].
# Picking STU, JKL, GHI therefore transposes to SJG, TKH, ULI, and picking those
# in order reveals "SKI" - a real word, so the final screenshot reads as a result
# rather than a random letter triple.
#
# Every tap targets text instead of screen coordinates so the same flow produces
# the same screens on phone and tablet form factors.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Think of a Word|No. of Letters|DejaVu"
    timeout: 20000
- takeScreenshot: store_01_splash_or_intro

# Word length
- extendedWaitUntil:
    visible: "No. of Letters"
    timeout: 15000
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- takeScreenshot: store_02_wordcount
- tapOn:
    text: "?"
    optional: true
- inputText: "3"
- tapOn: "next"

# Step 1 - the untouched letter grid
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- extendedWaitUntil:
    visible: "STU"
    timeout: 10000
- takeScreenshot: store_03_step1
- tapOn: "STU"
- tapOn: "JKL"
- tapOn: "GHI"
- tapOn: "next"

# Step 2 - transposed groups, captured with the stacked selection badges showing.
# This tutorial has to be dismissed too, otherwise its full-screen scrim swallows
# the taps below and the flow never reaches the reveal screen.
- extendedWaitUntil:
    visible: "Again!, One more time"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- extendedWaitUntil:
    visible: "SJG"
    timeout: 10000
- tapOn: "SJG"
- tapOn: "TKH"
- tapOn: "ULI"
- takeScreenshot: store_04_step2
- tapOn: "next"

# Reveal - wait for the zoom-in to settle so the word is at rest and readable
- extendedWaitUntil:
    visible: "Play with me"
    timeout: 20000
- takeScreenshot: store_05_result
